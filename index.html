<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>个人集成包</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --text:#1f2430; --sub:#6b7280;
    --muted2:#9aa1ad; --gear-bg:#ffffff;
    --sb-none-bg:#eef1f6; --sb-none-fg:#6b7280;
    --sb-ok-bg:#e7f6ee; --sb-ok-fg:#176b3a;
    --sb-warn-bg:#fff7e6; --sb-warn-fg:#8a6100;
    --sb-exp-bg:#fdecec; --sb-exp-fg:#b42318;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.05);
    --green:#2f9e63; --blue:#3b82f6; --amber:#f59e0b; --violet:#8b5cf6; --rose:#ef4444; --teal:#0d9488;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#111418; --card:#1b2026; --text:#e7eaee; --sub:#98a1ab;
      --muted2:#7d8790; --gear-bg:#1b2026;
      --sb-none-bg:#242a32; --sb-none-fg:#98a1ab;
      --sb-ok-bg:#14301f; --sb-ok-fg:#5dd68c;
      --sb-warn-bg:#332a12; --sb-warn-fg:#e8c66a;
      --sb-exp-bg:#3a1b1b; --sb-exp-fg:#ff8a8a;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--bg); color:var(--text);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
  .wrap{max-width:900px; margin:0 auto; padding:20px 20px 40px; min-height:100vh; display:flex; flex-direction:column;}
  header{padding:6px 0 14px; display:flex; align-items:center; justify-content:space-between; gap:12px;}
  header .t h1{margin:0; font-size:24px; letter-spacing:.5px;}
  header .t p{margin:4px 0 0; color:var(--sub); font-size:13.5px;}
  a.gear{flex:none; color:var(--sub); text-decoration:none; font-size:20px; padding:8px; border-radius:12px; background:var(--gear-bg); box-shadow:var(--shadow);}
  a.gear:hover{color:var(--text);}
  #syncBar{margin:0 0 16px; padding:10px 14px; border-radius:12px; font-size:12.5px; line-height:1.5;
           display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  #syncBar .txt{display:flex; align-items:center; gap:6px;}
  #syncBar a{color:inherit; font-weight:600; text-decoration:none; white-space:nowrap;}
  .sb-none{background:var(--sb-none-bg); color:var(--sb-none-fg);}
  .sb-ok{background:var(--sb-ok-bg); color:var(--sb-ok-fg);}
  .sb-warn{background:var(--sb-warn-bg); color:var(--sb-warn-fg);}
  .sb-exp{background:var(--sb-exp-bg); color:var(--sb-exp-fg);}
  /* 手机：2 列 × 3 行 */
  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:2px;}
  .card{display:flex; flex-direction:column; align-items:center; gap:9px; background:var(--card); border-radius:18px;
        padding:20px 10px 18px; text-decoration:none; color:inherit; box-shadow:var(--shadow);
        transition:transform .12s ease, box-shadow .12s ease;}
  .card:active{transform:scale(.96);}
  .card .ic{width:56px; height:56px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:27px; color:#fff;}
  .card .nm{margin:0; font-size:15px; font-weight:600; line-height:1;}
  .card .desc{display:none; margin:0; font-size:12.5px; color:var(--sub); line-height:1.5; text-align:center;}
  /* 电脑：3 列 × 2 行，卡片更大并显示简介 */
  @media(min-width:720px){
    .grid{grid-template-columns:repeat(3,1fr); gap:16px;}
    .card{padding:24px 18px 22px; gap:12px;}
    .card .ic{width:62px; height:62px; border-radius:18px; font-size:30px;}
    .card .nm{font-size:17px;}
    .card .desc{display:block;}
    @media(hover:hover){.card:hover{transform:translateY(-3px); box-shadow:0 8px 28px rgba(16,24,40,.14);}}
  }
  footer{margin-top:auto; padding-top:22px; color:var(--muted2); font-size:12px; text-align:center; line-height:1.7;}
  .c-green{background:var(--green);} .c-blue{background:var(--blue);} .c-amber{background:var(--amber);}
  .c-violet{background:var(--violet);} .c-rose{background:var(--rose);} .c-teal{background:var(--teal);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="t">
      <h1>个人集成包</h1>
      <p>一处集成，持续精进</p>
    </div>
    <a class="gear" href="settings.html" title="同步设置">⚙️</a>
  </header>

  <div id="syncBar" class="sb-none"><span class="txt">🔄 读取中…</span></div>

  <div class="grid">
    <a class="card" href="modules/ledger/index.html"><div class="ic c-green">💰</div><p class="nm">记账</p><p class="desc">收支 · 统计 · 加密同步</p></a>
    <a class="card" href="modules/study.html"><div class="ic c-blue">📚</div><p class="nm">学习</p><p class="desc">笔记 · 资料 · 复盘</p></a>
    <a class="card" href="modules/life.html"><div class="ic c-amber">🏠</div><p class="nm">生活</p><p class="desc">养鱼 · 生活日志</p></a>
    <a class="card" href="modules/work.html"><div class="ic c-violet">💼</div><p class="nm">工作</p><p class="desc">SOP · 记录</p></a>
    <a class="card" href="modules/fitness.html"><div class="ic c-rose">💪</div><p class="nm">锻炼</p><p class="desc">动作库 · SOP</p></a>
    <a class="card" href="modules/decision.html"><div class="ic c-teal">🧭</div><p class="nm">决策</p><p class="desc">成本收益 · 证据分级 · 手册</p></a>
  </div>

  <footer>数据归你所有 · 本地加密 · 跨设备同步</footer>
</div>

<script src="sync.js?v=4"></script>
<script>
  (function(){
    'use strict';
    var bar = document.getElementById('syncBar');
    var info = window.LifeHubSync.expiryInfo();
    var html, cls;
    if(!info.configured){
      cls = 'sb-none'; html = '<span class="txt">🔄 尚未配置同步</span><a href="settings.html">去设置 →</a>';
    } else if(info.permanent){
      cls = 'sb-ok'; html = '<span class="txt">✅ 同步已启用 · 令牌长期有效</span><a href="settings.html">设置</a>';
    } else if(info.expired){
      cls = 'sb-exp'; html = '<span class="txt">⛔ 令牌已到期</span><a href="settings.html">去更新 →</a>';
    } else if(info.days !== null && info.days <= 5){
      cls = 'sb-warn'; html = '<span class="txt">⚠️ 令牌 ' + info.days + ' 天后到期（' + info.expiresAt + '）</span><a href="settings.html">去更新 →</a>';
    } else {
      cls = 'sb-ok'; html = '<span class="txt">✅ 同步已启用 · 令牌 ' + info.expiresAt + ' 到期</span><a href="settings.html">设置</a>';
    }
    bar.className = cls; bar.innerHTML = html;
  })();
</script>
</body>
</html>
