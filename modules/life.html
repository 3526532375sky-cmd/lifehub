<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>生活 · 个人集成包</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --text:#1f2430; --sub:#6b7280; --muted:#9aa1ad;
    --border:#e6e9ee; --fill:#eef1f6; --amber:#f59e0b; --blue:#3b82f6; --green:#2f9e63; --red:#e5484d; --pink:#ec4899;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.05);
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#111418;--card:#1b2026;--text:#e7eaee;--sub:#98a1ab;--muted:#7d8790;--border:#2a313a;--fill:#242a32;--shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.35);}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;}
  .wrap{max-width:700px;margin:0 auto;padding:24px 20px 110px;}
  a.back{color:var(--blue);text-decoration:none;font-size:14px;}
  .head{margin:14px 0 18px;} .head h1{margin:0 0 6px;font-size:26px;} .head p{margin:0;color:var(--sub);font-size:14px;line-height:1.7;}
  .seg{display:flex;background:var(--fill);border-radius:10px;padding:3px;gap:3px;margin-bottom:14px;overflow-x:auto;}
  .seg button{flex:1 0 auto;border:none;background:transparent;padding:9px 12px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--sub);white-space:nowrap;}
  .seg button.on{background:var(--card);font-weight:600;color:var(--text);box-shadow:var(--shadow);}
  .card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);}
  .empty{color:var(--muted);font-size:13.5px;text-align:center;padding:16px 0;}
  .rec{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);}
  .rec-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;}
  .rec-type{font-size:12px;padding:3px 9px;border-radius:999px;font-weight:600;background:var(--fill);color:var(--sub);}
  .t-feed{background:#e7f6ee;color:#176b3a;} .t-water{background:#e6f1fc;color:#1d4ed8;} .t-obs{background:#fff7e6;color:#8a6100;} .t-other{background:var(--fill);color:var(--sub);}
  @media (prefers-color-scheme: dark){.t-feed{background:#14301f;color:#5dd68c}.t-water{background:#10253f;color:#7db8f5}.t-obs{background:#332a12;color:#e8c66a}}
  .rec-date{font-size:12px;color:var(--muted);}
  .rec-body{margin:0;font-size:14.5px;line-height:1.7;white-space:pre-wrap;}
  .fab{position:fixed;right:20px;bottom:24px;width:56px;height:56px;border-radius:50%;border:none;background:var(--amber);color:#fff;font-size:30px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.25);}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:60;}
  .modal.hidden{display:none;}
  .modal-box{background:var(--card);border-radius:18px 18px 0 0;padding:20px 18px 28px;width:100%;max-width:600px;max-height:90vh;overflow:auto;}
  @media(min-width:600px){.modal{align-items:center}.modal-box{border-radius:18px}}
  .field{margin-bottom:12px;} .field label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px;}
  input,select,textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:11px 12px;font-size:15px;background:var(--card);color:var(--text);outline:none;font-family:inherit;}
  textarea{min-height:88px;resize:vertical;line-height:1.6;}
  .btn{width:100%;padding:12px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;background:var(--amber);color:#fff;}
  .btn.ghost{background:var(--fill);color:var(--text);}
  .hidden{display:none;}
  .habit{display:flex;align-items:center;gap:10px;padding:10px 0;}
  .habit .info{flex:1;} .habit .nm{font-size:15px;font-weight:600;} .habit .st{font-size:12px;color:var(--muted);margin-top:2px;}
  .check{border:none;border-radius:12px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;background:var(--green);color:#fff;}
  .check.done{background:var(--fill);color:var(--sub);}
  .anniv{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;}
  .anniv .nm{font-size:15px;} .anniv .d{font-size:12px;color:var(--muted);margin-top:2px;} .anniv .days{font-size:14px;font-weight:700;color:var(--pink);}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">← 返回首页</a>
  <div class="head"><h1>🏠 生活</h1><p>养鱼日志 · 习惯打卡 · 纪念日。记录日常，让生活有条理。</p></div>

  <div class="seg" id="tabSeg">
    <button data-t="logs" class="on">日志</button>
    <button data-t="habits">习惯</button>
    <button data-t="annivs">纪念日</button>
  </div>

  <div id="list"></div>
</div>

<button class="fab" id="fab">＋</button>

<div class="modal hidden" id="modal">
  <div class="modal-box">
    <h2 style="margin:0 0 14px;font-size:18px" id="modalTitle"></h2>
    <div id="f_logs">
      <div class="field"><label>类型</label><select id="f_type"><option value="feed">喂食</option><option value="water">换水</option><option value="obs">观察</option><option value="other">其他</option></select></div>
      <div class="field"><label>日期</label><input id="f_date" type="date"></div>
      <div class="field"><label>内容</label><textarea id="f_content"></textarea></div>
    </div>
    <div id="f_habits" class="hidden">
      <div class="field"><label>习惯名称 *</label><input id="h_name" placeholder="如：早睡 / 喝水 / 阅读"></div>
    </div>
    <div id="f_annivs" class="hidden">
      <div class="field"><label>名称 *</label><input id="a_name" placeholder="如：某纪念日"></div>
      <div class="field"><label>日期</label><input id="a_date" type="date"></div>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn ghost" id="btnCancel">取消</button>
      <button class="btn" id="btnSave">保存</button>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';
  var KEY='life_data_v1', OLD='life_fish_records_v1';
  var data={logs:[],habits:[],annivs:[]};
  var tab='logs', editingId=null;
  var $=function(id){return document.getElementById(id)};
  function load(){
    try{var o=JSON.parse(localStorage.getItem(KEY))||{};data={logs:o.logs||[],habits:o.habits||[],annivs:o.annivs||[]}}catch(e){}
    // 迁移旧数据
    try{var old=JSON.parse(localStorage.getItem(OLD));if(old&&Array.isArray(old)&&old.length){old.forEach(function(r){if(!data.logs.some(function(x){return x.id===r.id}))data.logs.push(r)});localStorage.removeItem(OLD);save()}}catch(e){}
  }
  function save(){localStorage.setItem(KEY,JSON.stringify(data))}
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function typeLabel(t){return t==='feed'?'喂食':(t==='water'?'换水':(t==='obs'?'观察':'其他'))}
  function ymd(s){var p=s.split('-');return new Date(parseInt(p[0],10),parseInt(p[1],10)-1,parseInt(p[2],10))}
  function daysTo(dateStr){var now=new Date();now.setHours(0,0,0,0);return Math.round((ymd(dateStr)-now)/86400000)}
  function annivLabel(d){if(d<0)return '已过 '+Math.abs(d)+' 天';if(d===0)return '就是今天';return '还有 '+d+' 天'}

  function render(){
    var el=$('list'), arr=data[tab];
    if(!arr.length){el.innerHTML='<div class="empty">暂无内容，点右下角 ＋ 添加。</div>';return}
    var html='';
    if(tab==='logs'){
      html=arr.map(function(r){return '<div class="rec"><div class="rec-top"><span class="rec-type t-'+r.type+'">'+typeLabel(r.type)+'</span><span class="rec-date">'+esc(r.date)+'</span></div><p class="rec-body">'+esc(r.content)+'</p><div style="margin-top:8px;text-align:right"><button class="btn ghost" data-act="del" data-id="'+r.id+'" style="width:auto;padding:6px 12px">删除</button></div></div>'}).join('');
    }else if(tab==='habits'){
      var td=today();
      html=arr.map(function(h){var done=h.lastDate===td;return '<div class="habit"><div class="info"><div class="nm">'+esc(h.name)+'</div><div class="st">连续 '+h.streak+' 天'+(h.lastDate?(' · 上次 '+esc(h.lastDate)):'')+'</div></div><button class="check'+(done?' done':'')+'" data-check="'+h.id+'">'+(done?'已打卡':'打卡')+'</button><button class="btn ghost" data-act="del" data-id="'+h.id+'" style="width:auto;padding:6px 10px;font-size:12px">删</button></div>'}).join('');
    }else{
      html=arr.map(function(a){var d=daysTo(a.date);return '<div class="anniv"><div><div class="nm">'+esc(a.name)+'</div><div class="d">'+esc(a.date)+'</div></div><div class="days">'+annivLabel(d)+'</div><button class="btn ghost" data-act="del" data-id="'+a.id+'" style="width:auto;padding:6px 10px;font-size:12px">删</button></div>'}).join('');
    }
    el.innerHTML=html;
  }

  function switchTab(t){tab=t;editingId=null;document.querySelectorAll('#tabSeg button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-t')===t)});render()}
  function showFields(){['logs','habits','annivs'].forEach(function(t){$('f_'+t).classList.toggle('hidden',t!==tab)})}
  function openModal(r){
    editingId=r?r.id:null;
    var names={logs:'记录',habits:'习惯',annivs:'纪念日'};
    $('modalTitle').textContent=(r?'编辑':'添加')+names[tab];
    showFields();
    if(tab==='logs'){$('f_type').value=r?r.type:'feed';$('f_date').value=r?r.date:today();$('f_content').value=r?r.content:''}
    if(tab==='habits'){$('h_name').value=r?r.name:''}
    if(tab==='annivs'){$('a_name').value=r?r.name:'';$('a_date').value=r?r.date:today()}
    $('modal').classList.remove('hidden');
  }
  function closeModal(){$('modal').classList.add('hidden');editingId=null}

  $('tabSeg').addEventListener('click',function(e){var b=e.target.closest('button');if(b)switchTab(b.getAttribute('data-t'))});
  $('fab').addEventListener('click',function(){openModal(null)});
  $('btnCancel').addEventListener('click',closeModal);
  $('modal').addEventListener('click',function(e){if(e.target===this)closeModal()});
  $('list').addEventListener('click',function(e){
    var ck=e.target.closest('button[data-check]');if(ck){checkHabit(ck.getAttribute('data-check'));return}
    var b=e.target.closest('button[data-act]');if(!b)return;
    var id=b.getAttribute('data-id'),arr=data[tab];
    if(b.getAttribute('data-act')==='del'){data[tab]=arr.filter(function(r){return r.id!==id});save();render()}
  });
  function checkHabit(id){
    var h=data.habits.find(function(x){return x.id===id});if(!h)return;
    var td=today();
    if(h.lastDate===td){return}
    var yes=new Date();yes.setDate(yes.getDate()-1);
    var ys=yes.getFullYear()+'-'+String(yes.getMonth()+1).padStart(2,'0')+'-'+String(yes.getDate()).padStart(2,'0');
    h.streak=(h.lastDate===ys)?(h.streak+1):1;h.lastDate=td;save();render();
  }
  $('btnSave').addEventListener('click',function(){
    var obj;
    if(tab==='logs'){var c=$('f_content').value.trim();if(!c){alert('请填写内容');return}obj={type:$('f_type').value,date:$('f_date').value||today(),content:c}}
    else if(tab==='habits'){var n=$('h_name').value.trim();if(!n){alert('请填写习惯名称');return}obj={name:n,streak:0,lastDate:''}}
    else{var n2=$('a_name').value.trim(),d=$('a_date').value;if(!n2||!d){alert('请填写名称和日期');return}obj={name:n2,date:d}}
    if(editingId){data[tab]=data[tab].map(function(r){return r.id===editingId?Object.assign({},r,obj):r})}
    else{obj.id='l'+Date.now();obj.ts=Date.now();data[tab].push(obj)}
    save();closeModal();render();
  });

  load();render();
})();
</script>
</body>
</html>
