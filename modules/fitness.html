<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>锻炼 · 个人集成包</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --text:#1f2430; --sub:#6b7280; --muted:#9aa1ad;
    --border:#e6e9ee; --fill:#eef1f6; --rose:#ef4444; --green:#2f9e63; --blue:#3b82f6;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.05);
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#111418;--card:#1b2026;--text:#e7eaee;--sub:#98a1ab;--muted:#7d8790;--border:#2a313a;--fill:#242a32;--shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.35);}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;}
  .wrap{max-width:760px;margin:0 auto;padding:24px 20px 110px;}
  a.back{color:var(--blue);text-decoration:none;font-size:14px;}
  .head{margin:14px 0 18px;} .head h1{margin:0 0 6px;font-size:26px;} .head p{margin:0;color:var(--sub);font-size:14px;line-height:1.7;}
  .seg{display:flex;background:var(--fill);border-radius:10px;padding:3px;gap:3px;margin-bottom:14px;overflow-x:auto;}
  .seg button{flex:1 0 auto;border:none;background:transparent;padding:9px 12px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--sub);white-space:nowrap;}
  .seg button.on{background:var(--card);font-weight:600;color:var(--text);box-shadow:var(--shadow);}
  .card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow);}
  .card h2{margin:0 0 12px;font-size:16px;}
  .seg2{display:flex;background:var(--fill);border-radius:10px;padding:3px;gap:3px;margin-bottom:14px;}
  .seg2 button{flex:1;border:none;background:transparent;padding:9px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--sub);}
  .seg2 button.on{background:var(--card);font-weight:600;color:var(--text);box-shadow:var(--shadow);}
  .sop-list{margin:0;padding-left:20px;line-height:2.1;font-size:15px;} .sop-list li::marker{color:var(--green);font-weight:700;}
  .empty{color:var(--muted);font-size:13.5px;text-align:center;padding:14px 0;}
  .rec{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);}
  .rec-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .rec-name{font-size:16px;font-weight:700;margin:0;}
  .badge{font-size:11px;padding:3px 9px;border-radius:999px;font-weight:600;flex:none;}
  .b-pending{background:var(--fill);color:var(--sub);} .b-added{background:#e7f6ee;color:#176b3a;} .b-skip{background:#fdecec;color:#b42318;}
  @media (prefers-color-scheme: dark){.b-added{background:#14301f;color:#5dd68c}.b-skip{background:#3a1b1b;color:#ff8a8a}}
  .rec-src{font-size:12.5px;color:var(--sub);margin:8px 0 0;} .rec-src a{color:var(--blue);}
  .rec-points{margin:8px 0 0;font-size:14px;line-height:1.7;white-space:pre-wrap;}
  .meta{font-size:12px;color:var(--muted);margin-top:8px;}
  .acts{margin-top:10px;display:flex;gap:8px;} .acts button{border:none;background:var(--fill);border-radius:8px;padding:6px 10px;font-size:12.5px;cursor:pointer;color:var(--sub);}
  .fab{position:fixed;right:20px;bottom:24px;width:56px;height:56px;border-radius:50%;border:none;background:var(--rose);color:#fff;font-size:30px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.25);}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:60;}
  .modal.hidden{display:none;}
  .modal-box{background:var(--card);border-radius:18px 18px 0 0;padding:20px 18px 28px;width:100%;max-width:600px;max-height:90vh;overflow:auto;}
  @media(min-width:600px){.modal{align-items:center}.modal-box{border-radius:18px}}
  .field{margin-bottom:12px;} .field label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px;}
  input,select,textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:11px 12px;font-size:15px;background:var(--card);color:var(--text);outline:none;font-family:inherit;}
  textarea{min-height:80px;resize:vertical;line-height:1.6;}
  .row{display:flex;gap:10px;} .row .field{flex:1;}
  .row3{display:flex;gap:8px;} .row3 .field{flex:1;}
  .btn{width:100%;padding:12px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;background:var(--rose);color:#fff;}
  .btn.ghost{background:var(--fill);color:var(--text);}
  .hidden{display:none;}
  .w-summary{display:flex;gap:10px;margin-bottom:12px;}
  .w-summary .it{flex:1;background:var(--fill);border-radius:12px;padding:12px;text-align:center;}
  .w-summary .v{font-size:22px;font-weight:700;} .w-summary .l{font-size:12px;color:var(--muted);margin-top:2px;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">← 返回首页</a>
  <div class="head"><h1>💪 锻炼</h1><p>动作库 · 训练记录 · 体重趋势。记录、评估、沉淀成你的锻炼 SOP。</p></div>

  <div class="seg" id="tabSeg">
    <button data-t="records" class="on">动作库</button>
    <button data-t="workouts">训练记录</button>
    <button data-t="weights">体重</button>
  </div>

  <div id="sopWrap" class="card"><h2>📋 我的锻炼 SOP</h2><ol class="sop-list" id="sopList"></ol></div>

  <div class="seg2" id="filterSeg" style="display:none">
    <button data-s="all" class="on">全部</button>
    <button data-s="pending">待评估</button>
    <button data-s="added">已加入</button>
    <button data-s="skip">暂不加入</button>
  </div>

  <div id="list"></div>
</div>

<button class="fab" id="fab">＋</button>

<div class="modal hidden" id="modal">
  <div class="modal-box">
    <h2 style="margin:0 0 14px;font-size:18px" id="modalTitle"></h2>
    <div id="f_records">
      <div class="field"><label>动作名称 *</label><input id="r_name" placeholder="如：泽奇深蹲"></div>
      <div class="row"><div class="field"><label>来源类型</label><select id="r_srcType"><option value="video">视频</option><option value="book">书本</option><option value="web">网页</option><option value="other">其他</option></select></div><div class="field"><label>评估</label><select id="r_status"><option value="pending">待评估</option><option value="added">已加入</option><option value="skip">暂不加入</option></select></div></div>
      <div class="field"><label>来源</label><input id="r_source"></div>
      <div class="field"><label>要点提炼</label><textarea id="r_points"></textarea></div>
      <div class="field"><label>备注</label><textarea id="r_note"></textarea></div>
    </div>
    <div id="f_workouts" class="hidden">
      <div class="field"><label>日期</label><input id="w_date" type="date"></div>
      <div class="field"><label>动作 / 项目 *</label><input id="w_name" placeholder="如：泽奇深蹲"></div>
      <div class="row3"><div class="field"><label>组数</label><input id="w_sets" inputmode="decimal" placeholder="3"></div><div class="field"><label>次数</label><input id="w_reps" inputmode="decimal" placeholder="8"></div><div class="field"><label>重量(kg)</label><input id="w_weight" inputmode="decimal" placeholder="40"></div></div>
      <div class="field"><label>备注</label><textarea id="w_note"></textarea></div>
    </div>
    <div id="f_weights" class="hidden">
      <div class="field"><label>日期</label><input id="bw_date" type="date"></div>
      <div class="field"><label>体重 (kg) *</label><input id="bw_weight" inputmode="decimal" placeholder="如 65.0"></div>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn ghost" id="btnCancel">取消</button>
      <button class="btn" id="btnSave">保存</button>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';
  var KEY='fitness_data_v1';
  var data={records:[],workouts:[],weights:[]};
  var tab='records', filter='all', editingId=null;
  var $=function(id){return document.getElementById(id)};
  function load(){try{var o=JSON.parse(localStorage.getItem(KEY))||{};data={records:o.records||[],workouts:o.workouts||[],weights:o.weights||[]}}catch(e){}}
  function save(){localStorage.setItem(KEY,JSON.stringify(data))}
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function stLabel(s){return s==='added'?'已加入':(s==='skip'?'暂不加入':'待评估')}
  function srcLabel(t){return t==='video'?'视频':(t==='book'?'书本':(t==='web'?'网页':'其他'))}

  function renderSop(){
    var added=data.records.filter(function(r){return r.status==='added'});
    var el=$('sopList');
    if(!added.length){el.innerHTML='<span class="empty">还没有「已加入」的动作。</span>';return}
    el.innerHTML=added.map(function(r){return '<li>'+esc(r.name)+'</li>'}).join('');
  }

  function render(){
    renderSop();
    $('sopWrap').style.display=tab==='records'?'block':'none';
    $('filterSeg').style.display=tab==='records'?'flex':'none';
    var el=$('list'), arr=data[tab];
    if(!arr.length){el.innerHTML='<div class="empty">暂无内容，点右下角 ＋ 添加。</div>';return}
    var html='';
    if(tab==='records'){
      var list=filter==='all'?arr:arr.filter(function(r){return r.status===filter});
      if(!list.length){el.innerHTML='<div class="empty">该筛选下暂无记录。</div>';return}
      html=list.map(function(r){
        var src=r.source?('<div class="rec-src">'+srcLabel(r.srcType)+'：'+(/^https?:\/\//.test(r.source)?('<a href="'+esc(r.source)+'" target="_blank" rel="noopener">'+esc(r.source)+'</a>'):esc(r.source))+'</div>'):'';
        return '<div class="rec"><div class="rec-top"><div style="min-width:0"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="rec-name">'+esc(r.name)+'</span><span class="badge b-'+r.status+'">'+stLabel(r.status)+'</span></div>'+src+(r.points?('<div class="rec-points">'+esc(r.points)+'</div>'):'')+(r.note?('<div class="meta">备注：'+esc(r.note)+'</div>'):'')+'</div></div><div class="acts"><button data-act="edit" data-id="'+r.id+'">编辑</button><button data-act="del" data-id="'+r.id+'">删除</button></div></div>';
      }).join('');
    }else if(tab==='workouts'){
      html=arr.map(function(r){return '<div class="rec"><div class="rec-top"><span class="rec-name">'+esc(r.name)+'</span><span class="meta" style="margin:0">'+esc(r.date)+'</span></div>'+(r.sets||r.reps||r.weight?('<div class="rec-points">'+esc(r.sets||'-')+' 组 × '+esc(r.reps||'-')+' 次 × '+esc(r.weight||'-')+' kg</div>'):'')+(r.note?('<div class="meta">'+esc(r.note)+'</div>'):'')+'<div class="acts"><button data-act="edit" data-id="'+r.id+'">编辑</button><button data-act="del" data-id="'+r.id+'">删除</button></div></div>'}).join('');
    }else{
      var sorted=arr.slice().sort(function(a,b){return a.date<b.date?-1:1});
      var last=sorted[sorted.length-1], first=sorted[0];
      var delta=(last&&first&&sorted.length>1)?(Number(last.weight)-Number(first.weight)).toFixed(1):'—';
      html='<div class="w-summary"><div class="it"><div class="v">'+(last?last.weight:'—')+'</div><div class="l">最新(kg)</div></div><div class="it"><div class="v">'+(delta==='—'?'—':(delta>0?'+':'')+delta)+'</div><div class="l">期间变化</div></div><div class="it"><div class="v">'+sorted.length+'</div><div class="l">记录次数</div></div></div>';
      html+=sorted.map(function(r){return '<div class="rec"><div class="rec-top"><span class="rec-name">'+r.weight+' kg</span><span class="meta" style="margin:0">'+esc(r.date)+'</span><button class="btn ghost" data-act="del" data-id="'+r.id+'" style="width:auto;padding:5px 10px;font-size:12px">删</button></div></div>'}).join('');
    }
    el.innerHTML=html;
  }

  function switchTab(t){tab=t;editingId=null;document.querySelectorAll('#tabSeg button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-t')===t)});render()}
  function showFields(){['records','workouts','weights'].forEach(function(t){$('f_'+t).classList.toggle('hidden',t!==tab)})}
  function openModal(r){
    editingId=r?r.id:null;
    var names={records:'动作',workouts:'训练记录',weights:'体重记录'};
    $('modalTitle').textContent=(r?'编辑':'添加')+names[tab];
    showFields();
    if(tab==='records'){$('r_name').value=r?r.name:'';$('r_srcType').value=r?r.srcType:'video';$('r_status').value=r?r.status:'pending';$('r_source').value=r?r.source:'';$('r_points').value=r?r.points:'';$('r_note').value=r?r.note:''}
    if(tab==='workouts'){$('w_date').value=r?r.date:today();$('w_name').value=r?r.name:'';$('w_sets').value=r?r.sets:'';$('w_reps').value=r?r.reps:'';$('w_weight').value=r?r.weight:'';$('w_note').value=r?r.note:''}
    if(tab==='weights'){$('bw_date').value=r?r.date:today();$('bw_weight').value=r?r.weight:''}
    $('modal').classList.remove('hidden');
  }
  function closeModal(){$('modal').classList.add('hidden');editingId=null}

  $('tabSeg').addEventListener('click',function(e){var b=e.target.closest('button');if(b)switchTab(b.getAttribute('data-t'))});
  $('filterSeg').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;filter=b.getAttribute('data-s');this.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b)});render()});
  $('fab').addEventListener('click',function(){openModal(null)});
  $('btnCancel').addEventListener('click',closeModal);
  $('modal').addEventListener('click',function(e){if(e.target===this)closeModal()});
  $('list').addEventListener('click',function(e){
    var b=e.target.closest('button[data-act]');if(!b)return;
    var id=b.getAttribute('data-id'),act=b.getAttribute('data-act'),arr=data[tab];
    if(act==='del'){data[tab]=arr.filter(function(r){return r.id!==id});save();render()}
    else{var r=arr.find(function(x){return x.id===id});if(r)openModal(r)}
  });
  $('btnSave').addEventListener('click',function(){
    var obj;
    if(tab==='records'){var n=$('r_name').value.trim();if(!n){alert('请填写动作名称');return}obj={name:n,srcType:$('r_srcType').value,status:$('r_status').value,source:$('r_source').value.trim(),points:$('r_points').value.trim(),note:$('r_note').value.trim()}}
    else if(tab==='workouts'){var wn=$('w_name').value.trim();if(!wn){alert('请填写动作');return}obj={date:$('w_date').value||today(),name:wn,sets:$('w_sets').value.trim(),reps:$('w_reps').value.trim(),weight:$('w_weight').value.trim(),note:$('w_note').value.trim()}}
    else{var ww=parseFloat($('bw_weight').value);if(isNaN(ww)||ww<=0){alert('请填写有效体重');return}obj={date:$('bw_date').value||today(),weight:ww}}
    if(editingId){data[tab]=data[tab].map(function(r){return r.id===editingId?Object.assign({},r,obj):r})}
    else{obj.id='f'+Date.now();obj.ts=Date.now();data[tab].push(obj)}
    save();closeModal();render();
  });

  load();render();
})();
</script>
</body>
</html>
